name = "scott_models"
version = "0.1.0"
keywords = ["domain-theory", "scott", "equivalence", "lean4"]
defaultTargets = ["ScottModels", "Challenge", "Solution"]

# ScottModels is the proof library. Challenge / Solution are the Palomar
# Comparator pair. Sibling paper libraries live in vendor/ so one Palomar
# SHA has the complete split. They are compiled as this package's
# lean_libs (srcDir), not as Lake path deps: Comparator's landrun sandbox
# may write only under .lake/, and path packages try to write
# vendor/<pkg>/.lake (EACCES). Remotes remain the per-paper homes; see
# vendor/FROZEN.txt and PROVENANCE.md.

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

[[lean_lib]]
name = "Scott1972"
srcDir = "vendor/scott1972"

[[lean_lib]]
name = "Scott1980"
srcDir = "vendor/scott1980"

[[lean_lib]]
name = "Scott1982"
srcDir = "vendor/scott1982"

[[lean_lib]]
name = "ScottModels"

[[lean_lib]]
name = "everything"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
