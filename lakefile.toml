name = "scott_models"
version = "0.1.0"
keywords = ["domain-theory", "scott", "equivalence", "lean4"]
defaultTargets = ["ScottModels", "Challenge", "Solution"]

# ScottModels is the proof library. Challenge / Solution are the Palomar
# Comparator pair. Sibling paper libraries live in vendor/ (in-tree path
# deps) so one Palomar SHA has the complete split. Remotes remain the
# per-paper homes; see vendor/FROZEN.txt and PROVENANCE.md.

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0"

[[require]]
name = "scott1972"
path = "vendor/scott1972"

[[require]]
name = "scott1980"
path = "vendor/scott1980"

[[require]]
name = "scott1982"
path = "vendor/scott1982"

[[lean_lib]]
name = "ScottModels"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
