# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Scott 1982 — Theorem 7.2 (function-space elements)"
  description: >-
    A Lean 4 / mathlib formalization of Dana Scott's 1982 ICALP paper
    *Domains for Denotational Semantics*. The Palomar compared result is
    only the first sentence of Theorem 7.2: if A and B are information
    systems, then so is A → B, and the approximable mappings f : A → B
    are exactly the elements f ∈ |A → B|. Challenge.lean imports Mathlib only and locks Definition
    2.1, Definition 2.2, Definition 5.1, and Definition 7.1 (tokens,
    consistency, and the constructive-witness form of entailment). The
    remaining apply / curry clauses of the same numbered theorem live in
    Scott1982/Theorem72.lean and are not Comparator targets. The informal
    account is arxiv.md; ground truth for theorem wording is
    sources/Domains_for_Denotational_Semantics.pdf. Lean was written by
    AI agents under the direction and review of the author. Dana Scott
    did not participate in or endorse this formalization. There is no
    sorry outside the deliberate holes in Challenge.lean, no
    project-defined axiom, and Mathlib is the only Lake dependency.
  authors:
    - "Lars Warren Ericson"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Lars Warren Ericson"

repository:
  role: substantive-development

classification:
  arxiv: [cs.LO, math.LO]
  msc2020: ["68Q55", "06B35", "03B70"]

status:
  scope: >-
    Complete for the compared claim. theorem_7_2 is the compared
    declaration: approximable maps A → B are exactly the elements of the
    Definition 7.1 function-space system |A → B|. That is Scott's first
    Theorem 7.2 sentence only. Challenge.lean locks the information-system
    axioms, the carrier-inclusion order on elements, set-level entailment,
    approximable maps, and the concrete Definition 7.1 data (FunToken,
    FunCon, FunEnt, functionSystem). The broader paper is formalized in
    the same library but is not part of the advertised Comparator result.
    Additional Comparator theorem targets are proof obligations used only
    to lock these concrete definition bodies.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound"]
  main_results:
    - declaration: "Scott1982.InfoSys.theorem_7_2"
      file: "Scott1982/Theorem72.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []

fidelity:
  divergences: >-
    Ground truth: sources/Domains_for_Denotational_Semantics.pdf.
    Theorem 7.2 is quoted in Challenge.lean and as theorem_7_2.
    Definition 7.1 tokens are consistent pairs (u, v). Consistency is
    Scott's 7.1(iii). Entailment FunEnt is the constructive witness form
    of 7.1(iv): some s ⊆ w whose inputs are entailed by u' and whose
    output-union entails v', avoiding an undecidable filter on EntSet.
    Finset unions in the locked bodies are the choice-free ∪' restated
    in Challenge.lean (and proved in Scott1982.Constructive). The apply /
    curry clauses of Theorem 7.2 are proved in the library and are not
    Comparator targets. The compared statements assume DecidableEq on
    token types so the Finset operations of Definitions 2.1, 5.1, and 7.1
    can be formed.

sources:
  - title: "Domains for Denotational Semantics"
    authors: ["Dana S. Scott"]
    type: "paper"
    location: "In: Automata, Languages and Programming (ICALP 1982), LNCS 140, Springer, 1982. Theorem 7.2."
    relationship: formalizes
    author_endorsement: not-contacted
    note: >-
      Primary source. Dana Scott was not contacted and did not participate
      in or endorse this formalization. The compared claim is the first
      sentence of Theorem 7.2. Repository copy:
      sources/Domains_for_Denotational_Semantics.pdf. Narrative inventory:
      arxiv.md.

  - title: "A Lean 4 Formalization of Scott's Domains for Denotational Semantics (1982)"
    authors: ["Lars Warren Ericson"]
    type: "other"
    relationship: other
    author_endorsement: participated
    note: >-
      The author's write-up of this formalization in arxiv.md, not the
      1982 source paper.

related_formalizations:
  - id: "https://github.com/catskillsresearch/scott1972"
    relationship: other
    note: >-
      Same-author formalization of Scott 1972 Continuous Lattices. Not
      imported here. Palomar packaging follows that repository's
      Challenge / Solution pattern.

  - id: "https://github.com/catskillsresearch/scott1980"
    relationship: other
    note: "Same-author formalization of Scott PRG-19 (1981); not imported here."

  - id: "https://github.com/catskillsresearch/scott_models"
    relationship: other
    note: >-
      Same-author sibling with cross-presentation equivalence theorems
      for Scott 1972 / 1980 / 1982. Not imported here.

  - id: "https://github.com/catskillsresearch/cardb"
    relationship: other
    note: "Same-author Palomar template source; not imported here."

automation:
  methods:
    - method: agent
      models: ["Cursor Grok 4.6 High Fast (SpaceXAI / Cursor)"]
      framework: "Cursor"
      role: >-
        Primary agent for Lean 4 / mathlib formalization, lake build
        repair, Palomar Challenge / Solution packaging, and arxiv.md
        drafting.
    - method: agent
      models: ["Cursor Composer 2.5 Fast"]
      framework: "Cursor"
      role: "Routine scaffolding and medium-complexity proof obligations."
    - method: agent
      models: ["Anthropic Claude Sonnet 5 (medium reasoning)"]
      framework: "Cursor"
      role: "Day-to-day formalization and proof-engineering."
    - method: agent
      models: ["Anthropic Claude Opus 4.8 (high reasoning)"]
      framework: "Cursor"
      role: "Heaviest proof work including Theorem 7.2."
    - method: manual
      models: []
      role: >-
        The author chose the formalization route, reviewed every
        definition and claim, and takes sole responsibility for the
        mathematical content. Dana Scott was not consulted.
  notes: >-
    Palomar Challenge / Solution / comparator / formalization.yaml
    packaging was added under the author's direction, following the
    cardb and scott1972 templates.

review:
  status: self-assessed
  reviewers:
    - "Lars Warren Ericson"
  notes: >-
    The author directed and reviewed the development. No external review
    of the Lean source, and no review or endorsement by Dana Scott.
    Every proof step is checked by the Lean kernel.

known_gaps:
  - >-
    Palomar compares only the first sentence of Theorem 7.2
    (`theorem_7_2`). The apply and curry clauses of that numbered
    theorem are in the library, not in Comparator.
  - >-
    InfoSys, Element, ApproximableMap, and the PartialOrder instance
    are structures or instances and cannot be Comparator-locked. Their
    proof fields and the named order / function-system axiom theorems
    are locked instead.

limitations:
  - >-
    The Comparator-compared family is the first sentence of Theorem 7.2
    and the definitions it mentions, not the full paper inventory in
    arxiv.md.
  - >-
    The compared theorem is intended to depend only on propext and
    Quot.sound. Challenge.lean restates the choice-free Finset union
    locally so its import closure is Mathlib-only.
  - >-
    The compared statements assume DecidableEq on both token types.
    Scott's informal account is for arbitrary information systems; this
    is an implementation restriction needed for Finset operations, not an
    extra mathematical hypothesis on consistency or entailment.
  - >-
    Challenge.lean states the claim with deliberate sorries; Solution.lean
    and Scott1982/* supply the proofs.

alignment:
  namespace: "Scott1982.InfoSys"
  statements:
    - source: >-
        Scott 1982, Theorem 7.2 (sources/Domains_for_Denotational_Semantics.pdf):
        If A, B, and C are information systems, then so is A → B, and
        the approximable mappings f : A → B are exactly the elements
        f ∈ |A → B|.
      lean: "theorem_7_2"
      module: "Challenge (statement), Theorem72.lean (proof)"
      status: proved
      note: >-
        Challenge quotes that first sentence only. The library proves it
        by the two round-trips between ApproximableMap and
        (functionSystem A B).Element.

    - source: "Scott 1982, Definition 7.1: the function-space information system A → B"
      lean: "functionSystem"
      module: "Challenge (definition), FunctionSpace.lean"
      status: proved
      note: >-
        Compared as a definition. Tokens are FunToken; consistency is
        FunCon; entailment is the constructive witness form FunEnt.

    - source: "Scott 1982, Definition 2.1: information system"
      lean: "InfoSys"
      module: "Challenge (structure), InfoSys.lean"
      status: proved
      note: "Structure; compared via the theorem-type worklist."

    - source: "Scott 1982, Definition 2.2: set-level entailment"
      lean: "EntSet"
      module: "Challenge (definition), Definition22.lean"
      status: proved
      note: "Compared as a definition."

    - source: "Scott 1982, Definition 5.1: approximable mapping"
      lean: "ApproximableMap"
      module: "Challenge (structure), Approximable.lean"
      status: proved
      note: "Structure; compared via the theorem-type worklist."
