# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Scott 1981 — D ⊴ U (Theorem 8.8, first sentence + two corollaries)"
  description: >-
    A Lean 4 / mathlib formalization of Dana Scott's 1980 Oxford lectures,
    published May 1981 as PRG-19 Lectures on a Mathematical Theory of
    Computation. The principal sourced Palomar result is the first sentence
    of Theorem 8.8: the neighbourhood system U over [0,1) ⊆ ℚ is universal,
    in the sense that every countable neighbourhood system D embeds as a
    subdomain (D ⊴ U). Comparator also selects two new formal corollaries:
    P4_embeds for Scott's Example 1.5 and Ssys_embeds for Exercise 7.22.
    Scott defines those systems but does not separately state the embeddings.
    Challenge.lean fixes the neighbourhood-system vocabulary, including
    Scott's standing assumption that the master token set Δ is non-empty,
    Scott's ⊴, and the concrete Definition 8.7 family U. This
    foundational universality result supplies a concrete host for all
    countable domains; it is relevant to domain theory, denotational
    semantics, mathematical logic, and formalized mathematics. The
    broader Lectures I–VIII development lives in Scott1980/Neighborhood/*
    and is not the advertised Comparator result. The informal account is
    arxiv.md; the working transcription is sources/PRG19.md. Lean was
    written by AI agents under the direction and review of the author.
    Dana Scott did not participate in or endorse this formalization. There
    is no sorry outside the deliberate holes in Challenge.lean, no
    project-defined axiom, and Mathlib is the only Lake dependency.
  authors:
    - "Lars Warren Ericson"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Lars Warren Ericson"

classification:
  arxiv: [cs.LO, math.LO]
  msc2020: ["68Q55", "06B35", "03B70"]

status:
  scope: >-
    Complete for the three compared embedding results. The principal sourced
    declaration is theorem_8_8: for every countable neighbourhood system D
    one has D ⊴ U, i.e. D ≅ D' for some subsystem D' ◁ U. This is Scott's
    first Theorem 8.8 sentence. The other compared declarations are two new
    formal corollaries obtained by specialization: Example 1.5 (`P4_embeds`)
    and Exercise 7.22's system S (`Ssys_embeds`). Scott defines those systems
    but does not separately state these embeddings. Challenge.lean also locks
    the filter-element order (element_le), the Definition 8.7 membership
    predicate UMem, the non-emptiness of the master token sets, and the
    concrete value of U. The
    broader book is formalized in the same library but is not part of
    the advertised Comparator result; Exercise 8.17 Part 2 remains a
    documented deferral. Additional Comparator theorem targets are
    proof obligations used only to lock these concrete definition
    bodies.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "Scott1980.Neighborhood.theorem_8_8"
      file: "Scott1980/Neighborhood/Theorem88a.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "Scott1980.Neighborhood.Example15.P4_embeds"
      file: "Scott1980/Neighborhood/PalomarExamples.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "Scott1980.Neighborhood.Exercise722.Ssys_embeds"
      file: "Scott1980/Neighborhood/PalomarExamples.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []

fidelity:
  divergences: >-
    Working source: sources/PRG19.md. Theorem 8.8 there is quoted in
    Challenge.lean and as theorem_8_8. Scott writes D ⊴ U; Lean Trianglelefteq
    is the prose before Lemma 6.15 (D ≅ D' for some D' ◁ U). Scott's standing
    assumption immediately before Definition 1.1 that the master token set Δ
    is non-empty is enforced by NeighborhoodSystem.master_nonempty.
    Definition 8.7
    takes U as the non-empty finite unions of rational [r,s) inside [0,1).
    Lean UMem presents those unions by List (ℚ × ℚ) without per-pair bound
    side-conditions; U_mem_iff_scott in Definition87.lean proves this is
    equivalent to Scott's literal per-pair 0 ≤ r < s ≤ 1 family. The
    principal compared theorem is the general (non-effective) first sentence
    of 8.8; P4_embeds and Ssys_embeds are new formal corollaries. The
    effective refinement theorem_8_8_b and the finitary-projection
    correspondence theorem_8_8_c are proved in the library but are not
    Comparator targets.

