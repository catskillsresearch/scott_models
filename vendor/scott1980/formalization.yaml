automation:
  methods:
    - method: agent
      models: ["Cursor Grok 4.6 High Fast (SpaceXAI / Cursor)"]
      framework: "Cursor"
      role: >-
        Primary agent for Lean 4 / mathlib formalization, lake build
        repair, Palomar Challenge / Solution packaging, and arxiv.md
        drafting.
    - method: agent
      models: ["Cursor Composer 2.5 Fast"]
      framework: "Cursor"
      role: "Routine scaffolding and medium-complexity proof obligations."
    - method: agent
      models: ["Anthropic Claude Sonnet 5 (medium reasoning)"]
      framework: "Cursor"
      role: "Day-to-day formalization and proof-engineering."
    - method: agent
      models: ["Anthropic Claude Opus 4.8 (high reasoning)"]
      framework: "Cursor"
      role: "Heaviest proof work including Theorem 8.8."
    - method: agent
      models: ["GPT-5.6 Sol"]
      framework: "Cursor"
      role: >-
        Palomar v2 fidelity migration: structural non-empty master token
        sets, constructor repair, public scope alignment, and validation.
    - method: manual
      models: []
      role: >-
        The author chose the formalization route, reviewed every
        definition and claim, and takes sole responsibility for the
        mathematical content. Dana Scott was not consulted.
  notes: >-
    Palomar Challenge / Solution / comparator / formalization.yaml
    packaging was added under the author's direction, following the
    cardb and scott1972 templates.

review:
  status: self-assessed
  reviewers:
    - "Lars Warren Ericson"
  notes: >-
    The author directed and reviewed the development. No external review
    of the Lean source, and no review or endorsement by Dana Scott.
    Every proof step is checked by the Lean kernel. Palomar's automated v1
    review identified two non-blocking presentation/fidelity warnings; this
    version addresses both before a fresh v2 review.

known_gaps:
  - >-
    Palomar compares the first sentence of Theorem 8.8 (`theorem_8_8`) plus
    the new formal corollaries `P4_embeds` and `Ssys_embeds`. The effective
    second sentence (`theorem_8_8_b`) and finitary-projection third sentence
    (`theorem_8_8_c`) are in the library, not in Comparator.
  - >-
    Exercise 8.17 Part 2 (whether U+U, U×U, or U→U is isomorphic to U) is
    deliberately deferred. Scott flagged the function-space case as open.
  - >-
    NeighborhoodSystem, Element, Subsystem, and the PartialOrder instance
    are structures or instances and cannot be listed as ordinary Comparator
    definition targets. Their reached structure declarations, selected proof
    fields (including concrete master-nonemptiness proofs), and the named
    relation element_le are compared instead.

limitations:
  - >-
    The Comparator-compared embedding results are the first sentence of
    Theorem 8.8 (general universality D ⊴ U) and the two new formal
    corollaries P4_embeds and Ssys_embeds. The full three-sentence theorem
    and the PRG-19 inventory in arxiv.md are not Comparator scope.
  - >-
    The compared embedding theorems depend on propext, Classical.choice,
    and Quot.sound. Classical.choice enters via Countable.nonempty
    surjections and Mathlib's order instance on ℚ.
  - >-
    Challenge.lean states the claim with deliberate sorries; Solution.lean
    and Scott1980/Neighborhood/* supply the proofs.

alignment:
  namespace: "Scott1980.Neighborhood"
  statements:
    - source: >-
        sources/PRG19.md, first sentence of Theorem 8.8: The system U is
        universal in the sense that, for every countable neighbourhood
        system D, we have D ⊴ U.
      lean: "theorem_8_8"
      module: "Challenge (statement), Theorem88a.lean (proof)"
      status: proved
      note: >-
        Challenge quotes that first sentence only. The library proves it
        by packaging theorem_8_8_a (D ≅ D' ∧ D' ◁ U) as D ⊴ U.

    - source: "Scott 1981, Definition 8.7: the universal neighbourhood system U"
      lean: "U"
      module: "Challenge (definition), Definition87.lean"
      status: proved
      note: >-
        Compared as a definition. Membership is UMem (list presentation;
        equivalent to Scott's per-pair 0 ≤ r < s ≤ 1 family by
        U_mem_iff_scott).

    - source: "Scott 1981, Definition 1.1: neighbourhood system"
      lean: "NeighborhoodSystem"
      module: "Challenge (structure), Basic.lean"
      status: proved
      note: >-
        Structure; compared through the reached statement closure. Its
        master_nonempty field records Scott's standing non-empty-Δ
        assumption immediately before Definition 1.1.

    - source: "Scott 1981, Definition 1.6 / 1.9: elements and domain isomorphism"
      lean: "DomainIso"
      module: "Challenge (definition), Basic.lean"
      status: proved
      note: "Compared as a definition."

    - source: "Scott 1981, Definition 6.10 and the prose before Lemma 6.15: ◁ and ⊴"
      lean: "Trianglelefteq"
      module: "Challenge (definition), Lemma615.lean"
      status: proved
      note: "Compared as a definition."

    - source: "Scott 1981, Example 1.5: all nonempty subsets of {0,1,2,3}"
      lean: "P4_embeds"
      module: "Challenge (statement), PalomarExamples.lean"
      status: proved
      note: >-
        New formal corollary, not separately stated by Scott: applying
        theorem_8_8 to Scott's finite Example 1.5 gives the embedding.

    - source: "Scott 1981, Exercise 7.22: the least-fixed-point family S over {0,1}*"
      lean: "Ssys_embeds"
      module: "Challenge (statement), PalomarExamples.lean"
      status: proved
      note: >-
        New formal corollary, not separately stated by Scott: countability
        via SExpr lets theorem_8_8 embed Scott's system S into U. SExpr is
        shown in Challenge.lean but is not Comparator-locked.
