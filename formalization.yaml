  - id: "https://github.com/catskillsresearch/scott1980/tree/f6cbc2d62a636ab24e60d185f80c0f61daf73fe1"
    relationship: other
    note: >-
      Same-author per-paper home for PRG-19 neighbourhood systems,
      frozen at f6cbc2d62a636ab24e60d185f80c0f61daf73fe1 and copied
      into vendor/scott1980. The remote remains the 1980 development.

  - id: "https://github.com/catskillsresearch/scott1982/tree/7ed95c16db5be1131f79af84cdf29ba18f07646a"
    relationship: other
    note: >-
      Same-author per-paper home for Scott 1982 information systems
      (through Factoid 8.4 / domain equations), frozen at
      7ed95c16db5be1131f79af84cdf29ba18f07646a and copied into
      vendor/scott1982. The remote remains the 1982 development.

  - id: "https://github.com/Vilin97/lean-pool/tree/main/LeanPool/DomainTheory"
    relationship: other
    note: >-
      Public downstream ingest of catskillsresearch/domain_theory
      (candidates/provenance.jsonl: repo catskillsresearch/domain_theory,
      authors Catskills Research Company). Apache-2.0 permitted the
      copy. Incomplete relative to this snapshot (ContinuousLattice +
      Neighborhood + a short InfoSys; no full scott1982, no bridges).
      Not prior work this formalization follows; a later copy of an
      earlier repo of the same author. This SHA is the complete source
      to copy.

# ---------------------------------------------------------------------------
# How this was produced.
# ---------------------------------------------------------------------------
automation:
  methods:
    - method: agent
      models: ["Cursor Grok 4.5 (SpaceXAI / Cursor)"]
      framework: "Cursor"
      role: >-
        Primary agent for the ScottModels bridge theorems
        (neighborhoodSystem_to_infoSys, infoSys_to_neighborhoodSystem,
        presentation_domains_equiv, round filters) and the narrative in
        arxiv.md / view.pdf. Used in the Cursor agent environment.
        Generated Lean was provisional until it compiled under the
        pinned toolchain (leanprover/lean4:v4.30.0).
    - method: agent
      models: ["Cursor Composer 2.5 Fast (Anysphere)"]
      framework: "Cursor"
      role: >-
        Module scaffolding, dependency-ordered wiring of ScottModels/,
        and medium proof obligations where the strategy was already
        fixed. Also used in the sibling paper libraries.
    - method: agent
      models: ["Cursor Grok 4.6 (SpaceXAI / Cursor)"]
      framework: "Cursor"
      role: >-
        Palomar packaging of the existing bridges: Challenge.lean,
        Solution.lean, comparator.json, formalization.yaml, and
        conversion of sibling Lake dependencies. Did not re-prove the
        compared isos. Later session vendored the three paper repos
        into vendor/ for one Palomar SHA.
    - method: agent
      models: ["Claude Sonnet 5 (Anthropic)", "Claude Opus 4.8 (Anthropic)", "Gemini 3.5 Flash (Google DeepMind)"]
      framework: "Cursor"
      role: >-
        Used in the sibling paper libraries (scott1972 / scott1980 /
        scott1982) whose type surface and portable proof patterns this
        package imports. Listed because that prior work is a dependency
        of the bridges.
    - method: manual
      models: []
      role: >-
        The author chose the formalization route, reviewed every
        definition and claim, and takes sole responsibility for the
        mathematical content. No large language model is listed as a
        co-author.
  notes: >-
    The compared isos were developed in earlier Cursor agent sessions
    and are already sorry-free in ScottModels/. Palomar Challenge /
    Solution / comparator / formalization.yaml packaging was added
    later by an agent under the author's direction. A search of
    Mathlib, Tau Ceti, and public Lean domain-theory repositories did
    not locate a prior Lean development of the cross-presentation
    bridges of all three presentations; related_formalizations records
    only the three per-paper siblings.

review:
  status: self-assessed
  reviewers:
    - "Lars Warren Ericson"
  notes: >-
    The author directed and reviewed the development as it was
    produced. No external or independent review has been performed, and
    no mathematician other than the author has read the Lean source.
    Every compared declaration is checked by Lean against Mathlib and
    the pinned sibling packages.

known_gaps: []

limitations:
  - >-
    No novelty is claimed, and Palomar is not a novelty stamp. A search
    for a prior Lean formalization of the bridges of all three
    presentations did not find one; that search can be empty in the
    sense that no such development was located, not that none exists
    unpublished.
  - >-
    The compared declarations are permitted to depend on propext,
    Quot.sound and Classical.choice. The 1980 ↔ 1982 maps,
    presentation_domains_equiv, sexNeighborhoodIso, and sexIdealIso
    audit to {propext, Quot.sound}. sexDomainEquationIso uses
    Classical.choice via the 1982 sum trichotomy; Classical.choice is
    also listed because the 1972 topological definition of ≪ is the
    classical frontier elsewhere in the library. There is no sorry
    outside the deliberate holes in Challenge.lean, no project-defined
    axiom, and no native_decide.
  - >-
    Challenge.lean states the family but does not prove it; that is the
    Comparator convention. Solution.lean re-exports the ScottModels
    proofs. Challenge restates the type surface (InfoSys,
    NeighborhoodSystem, NbhdBasis, IsContinuousLattice, round filters,
    TreeToken / SumToken / ProdToken, treeSystem) under the sibling
    namespaces so that Comparator can match names and types; it is not
    a copy of the ScottModels proof modules.
  - >-
    The compared claim is the named bridges, not “we formalized Scott
    1972 / PRG-19 / ICALP 1982,” not LRSOD / D∞ ≅ [D∞ → D∞], and not a
    Mathlib or Tau Ceti ingest.

alignment:
  namespace: "ScottModels"
  statements:
    - source: "A neighbourhood system with a decidable exhaustive coding induces an information system (view.pdf, §3.2)"
      lean: "neighborhoodSystem_to_infoSys"
      module: "Challenge (statement), Solution / ScottModels.NeighborhoodToInfoSys (proof)"
      status: proved
      note: >-
        Compared by Comparator as a definition. Tokens are neighbourhood
        indices; Con is membership of the finite intersection in 𝒟.

    - source: "Basic opens [u] form a neighbourhood system on |A| (view.pdf, §3.3)"
      lean: "infoSys_to_neighborhoodSystem"
      module: "Challenge (statement), Solution / ScottModels.InfoSysToNeighborhood (proof)"
      status: proved
      note: Compared by Comparator as a definition.

    - source: "|A| ≃o filters of the basic-open neighbourhood system (view.pdf, §3.3)"
      lean: "InfoSysToNeighborhood.domainOrderIso"
      module: "Challenge (statement), Solution / ScottModels.InfoSysToNeighborhood (proof)"
      status: proved
      note: Compared by Comparator as a definition (OrderIso is data).

    - source: "D ≃o RoundFilter ≃o RoundInfoSysElement under IsContinuousLattice (view.pdf, §3.6)"
      lean: "presentation_domains_equiv"
      module: "Challenge (statement), Solution / ScottModels.PresentationDomains (proof)"
      status: proved
      note: >-
        Compared by Comparator as a definition. The ↟-system's NbhdBasis
        supplies the 1980↔1982 coding. Raw |𝒟| / full |A| remain larger.

    - source: "|T| ≃o filters of [u] on the S-expression domain (view.pdf, §5.5)"
      lean: "sexNeighborhoodIso"
      module: "Challenge (statement), Solution / ScottModels.WorkedExampleSExpr (proof)"
      status: proved
      note: >-
        Instance of InfoSysToNeighborhood.domainOrderIso at Factoid 8.1
        SexSys. Compared by Comparator as a definition.

    - source: "|T| ≃o Ideal(K(T)) on the S-expression domain (view.pdf, §5.5)"
      lean: "sexIdealIso"
      module: "Challenge (statement), Solution / ScottModels.WorkedExampleSExpr (proof)"
      status: proved
      note: Instance of InfoSysToIdealCompletion.domainOrderIso at SexSys.

    - source: "WithBot (|A| ⊕ (|T| × |T|)) ≃o |A + (T × T)| (view.pdf, §5.6)"
      lean: "sexDomainEquationIso"
      module: "Challenge (statement), Solution / ScottModels.WorkedExampleSExpr (proof)"
      status: proved
      note: >-
        Domain-level lift of Factoid 8.1. Classical.choice enters only
        through the 1982 separated-sum trichotomy.
