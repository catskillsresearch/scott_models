# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Equivalence of Scott's three presentations of domain theory"
  description: >-
    Order isomorphisms relating Scott’s three presentations of domains —
    continuous lattices (1972), neighbourhood systems (PRG-19), and
    information systems (1982) — including the round identification
    D ≃o RoundFilter ≃o RoundInfoSysElement and the S-expression
    equation T ≅ A + (T × T) as |T| ≃o |A + (T × T)|
    (SexSys.Element ≃o SexRhs.Element). Not a formalization of the
    three papers. Account: view.pdf.
  authors:
    - "Lars Warren Ericson"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Lars Warren Ericson"

repository:
  role: substantive-development

classification:
  arxiv: [cs.LO, math.LO]
  msc2020: ["06B35", "68Q55"]

status:
  scope: >-
    Complete for the compared family, with no unproved step in the
    ScottModels proof modules. The 1980 ↔ 1982 coding, the round
    continuous-lattice identification D ≃o RoundInfoSysElement, and
    the S-expression instance (sexNeighborhoodIso, sexIdealIso,
    sexDomainEquationIso) are stated and proved. The rest of the
    ScottModels library (general constructions, ScottMap conjugation,
    LRSOD) is out of the compared family. Nothing in the compared
    statements is imported from a prior Palomar entry.
  # The proof development contains no sorry at all. The only sorries in the
  # repository that belong to this snapshot are the deliberate placeholders
  # in Challenge.lean, which these counts exclude by convention.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - declaration: "ScottModels.neighborhoodSystem_to_infoSys"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "ScottModels.infoSys_to_neighborhoodSystem"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "ScottModels.InfoSysToNeighborhood.domainOrderIso"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "ScottModels.presentation_domains_equiv"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "ScottModels.sexNeighborhoodIso"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "ScottModels.sexIdealIso"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "ScottModels.sexDomainEquationIso"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []

fidelity:
  divergences: >-
    The informal note speaks of three presentations determining the same
    domains up to order isomorphism. The compared Lean statements are the
    named bridges, not a 2-categorical equivalence of the full categories
    with all morphisms. The 1972 corner is D ≃o RoundFilter ≃o
    RoundInfoSysElement, not raw |𝒟| ≃o D. Informal [u] is
    InfoSys.basicOpen; informal ↟a is wayBelowUp. DecidableEq on tokens
    (and on D for the ↟-coding) is required so InfoSys can use the
    choice-free Finset prelude. The sibling packages remain the
    per-paper remotes; this snapshot vendors modified copies in
    vendor/ (revisions and local patches: vendor/FROZEN.txt) and
    proves the maps between them.

# ---------------------------------------------------------------------------
# Mathematical sources.
#
# The compared claim independently proves a known equivalence (Scott /
# folklore), not a first presentation of that result. view.pdf is the
# formalization's write-up (`other`), not an original-proof source.
# ---------------------------------------------------------------------------
sources:
  - title: "Equivalence of Scott's Three Presentations of Domain Theory"
    authors: ["Lars Warren Ericson"]
    type: "notes"
    id: "https://github.com/catskillsresearch/scott_models/blob/main/view.pdf"
    relationship: other
    author_endorsement: participated
    note: >-
      Write-up of this formalization (view.pdf; source arxiv.md), not a
      claim that the equivalence is original. It catalogs the named
      bridges, the round-filter identification D ≃o RoundFilter, and
      D ≃o RoundInfoSysElement. Challenge.lean is checked against those
      named results, not against a transcription of Scott 1972 / 1981 /
      1982 in full.

  - title: "Continuous Lattices"
    authors: ["Dana Scott"]
    type: "article"
    location: "In F. W. Lawvere (ed.), Toposes, Algebraic Geometry and Logic, LNM 274, Springer, 1972"
    relationship: background
    note: >-
      Source of IsContinuousLattice, the way-below relation ≪, and the
      1972 presentation. Background for the compared bridges; this
      package does not re-prove Scott's internal theorems and does not
      register a formalization of the 1972 paper.

  - title: "Lectures on a Mathematical Theory of Computation"
    authors: ["Dana Scott"]
    type: "article"
    location: "Technical Monograph PRG-19, Oxford University Computing Laboratory, 1981"
    relationship: background
    note: >-
      Source of NeighborhoodSystem and filters as domain elements
      (neighbourhood systems). Background for the 1980 corner of the
      coding and of the basic-open converse.

  - title: "Domains for Denotational Semantics"
    authors: ["Dana Scott"]
    type: "article"
    location: "ICALP 1982, LNCS 140, Springer, 1982"
    relationship: background
    note: >-
      Source of InfoSys (Definition 2.1), Factoid 8.1 (T ≅ A + (T × T)),
      and the remark that neighbourhood systems and information systems
      are equivalent “in a precise sense.” Background for the 1982
      presentation; the compared claim independently proves that known
      equivalence as named order isomorphisms, and does not formalize
      the ICALP paper in full.

  - title: "Folklore equivalence of the three presentations"
    authors: []
    type: "folklore"
    relationship: independently-proves
    note: >-
      Prior result: continuous lattices, neighbourhood systems, and
      information systems determine the same class of domains (via
      ideal completion and the Scott topology), as already remarked by
      Scott (1982) for the neighbourhood / information pair. This
      package independently proves the named order isomorphisms
      (including D ≃o RoundFilter ≃o RoundInfoSysElement), not a
      functorial equivalence of categories. The equivalence is not
      claimed as original.

