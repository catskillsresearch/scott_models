# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Equivalence of Scott's three presentations of domain theory"
  description: >-
    A Lean formalization of the presentation-bridge isos relating Scott's
    three presentations of the same class of domains: continuous lattices
    (1972), neighbourhood systems (PRG-19 / 1980–81), and information
    systems (1982). The compared family is not a dump of those three
    papers. It is the small cross-presentation maps: a neighbourhood
    system with a decidable exhaustive coding NbhdBasis induces an
    InfoSys on the codes (neighborhoodSystem_to_infoSys); an information
    system A induces the basic-open neighbourhood system of [u] =
    {x ∈ |A| | ↑u ⊆ x} (infoSys_to_neighborhoodSystem) with
    InfoSysToNeighborhood.domainOrderIso : |A| ≃o those filters; under
    IsContinuousLattice D and DecidableEq D,
    presentation_domains_equiv : D ≃o RoundInfoSysElement, i.e.
    D ≃o RoundFilter ≃o RoundInfoSysElement via the ↟-coding
    wayBelowNbhdBasis; and on Scott’s S-expression domain
    T ≅ A + (T × T) (Factoid 8.1 over ℕ lower-bound atoms),
    sexNeighborhoodIso / sexIdealIso identify |T| with basic-open
    filters and with Ideal(K(T)), while sexDomainEquationIso lifts the
    equation to WithBot (|A| ⊕ (|T| × |T|)) ≃o |A + (T × T)|. Raw |𝒟|
    and the full InfoSys domain are properly larger than D; the
    identification is the round corner. The informal account is the
    companion note view.pdf (source arxiv.md) in this repository. The
    Lean source was written by AI agents under the direction and review
    of the author. There is no sorry outside the deliberate holes in
    Challenge.lean, no project-defined axiom, and the Solution depends
    on in-tree vendor/ copies of the author's three sibling paper
    libraries (frozen SHAs in vendor/FROZEN.txt).
  authors:
    - "Lars Warren Ericson"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Lars Warren Ericson"

repository:
  role: substantive-development

classification:
  arxiv: [cs.LO, math.LO]
  msc2020: ["06B35", "68Q55"]

status:
  scope: >-
    Complete for the compared family, with no unproved step in the
    ScottModels proof modules. The 1980 ↔ 1982 coding, the round
    continuous-lattice identification D ≃o RoundInfoSysElement, and
    the S-expression instance (sexNeighborhoodIso, sexIdealIso,
    sexDomainEquationIso) are stated and proved. The rest of the
    ScottModels library (general constructions, ScottMap conjugation,
    LRSOD) is out of the compared family. Nothing in the compared
    statements is imported from a prior Palomar entry.
  # The proof development contains no sorry at all. The only sorries in the
  # repository that belong to this snapshot are the deliberate placeholders
  # in Challenge.lean, which these counts exclude by convention.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - declaration: "ScottModels.neighborhoodSystem_to_infoSys"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "ScottModels.infoSys_to_neighborhoodSystem"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "ScottModels.InfoSysToNeighborhood.domainOrderIso"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "ScottModels.presentation_domains_equiv"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "ScottModels.sexNeighborhoodIso"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "ScottModels.sexIdealIso"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "ScottModels.sexDomainEquationIso"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
      literature_dependencies: []

fidelity:
  divergences: >-
    The informal note speaks of three presentations determining the same
    domains up to order isomorphism. The compared Lean statements are the
    named bridges, not a 2-categorical equivalence of the full categories
    with all morphisms. The 1972 corner is D ≃o RoundFilter ≃o
    RoundInfoSysElement, not raw |𝒟| ≃o D. Informal [u] is
    InfoSys.basicOpen; informal ↟a is wayBelowUp. DecidableEq on tokens
    (and on D for the ↟-coding) is required so InfoSys can use the
    choice-free Finset prelude. The sibling packages remain the
    per-paper remotes; this snapshot vendors them in vendor/ and proves
    the maps between them.

# ---------------------------------------------------------------------------
# Mathematical sources.
#
# The compared claim is the machine-checked bridges and the round-filter
# identification, first written up in this repository's view.pdf. Scott's
# three papers are adapted as the presentations being related, not as
# "we formalized paper X." The folklore that the three presentations
# carve out the same class of domains is independently proved at the
# level of these isos.
# ---------------------------------------------------------------------------
sources:
  - title: "Equivalence of Scott's Three Presentations of Domain Theory"
    authors: ["Lars Warren Ericson"]
    type: "original-proof"
    id: "https://github.com/catskillsresearch/scott_models/blob/main/view.pdf"
    relationship: other
    author_endorsement: participated
    note: >-
      Original write-up in this repository (view.pdf; source arxiv.md),
      not an external source being formalized. Relationship is `other`
      because Palomar reserves `formalizes` for following an existing
      source. The note carries the catalog of bridges, the round-filter
      identification D ≃o RoundFilter, and the three-presentation iso
      D ≃o RoundInfoSysElement. Challenge.lean is checked against those
      named results, not against a transcription of Scott 1972 / 1981 /
      1982 in full.

  - title: "Continuous Lattices"
    authors: ["Dana Scott"]
    type: "article"
    location: "In F. W. Lawvere (ed.), Toposes, Algebraic Geometry and Logic, LNM 274, Springer, 1972"
    relationship: adapts
    note: >-
      Source of IsContinuousLattice, the way-below relation ≪, and the
      1972 presentation. Adapted as one corner of the bridges; this
      package does not re-prove Scott's internal theorems and does not
      register a formalization of the 1972 paper.

  - title: "Lectures on a Mathematical Theory of Computation"
    authors: ["Dana Scott"]
    type: "article"
    location: "Technical Monograph PRG-19, Oxford University Computing Laboratory, 1981"
    relationship: adapts
    note: >-
      Source of NeighborhoodSystem and filters as domain elements
      (neighbourhood systems). Adapted as the 1980 corner of the coding
      and of the basic-open converse.

  - title: "Domains for Denotational Semantics"
    authors: ["Dana Scott"]
    type: "article"
    location: "ICALP 1982, LNCS 140, Springer, 1982"
    relationship: adapts
    note: >-
      Source of InfoSys (Definition 2.1) and of the remark that
      neighbourhood systems and information systems are equivalent “in
      a precise sense.” Adapted as the 1982 corner; the compared claim
      is the coding and the domain iso, not a formalization of the
      ICALP paper.

  - title: "Folklore equivalence of the three presentations"
    authors: []
    type: "folklore"
    relationship: independently-proves
    note: >-
      The stronger folklore that continuous lattices, neighbourhood
      systems, and information systems determine the same class of
      domains (via ideal completion and the Scott topology). Proved
      here only as the named order isomorphisms, including the round
      identification D ≃o RoundFilter, not as a functorial equivalence
      of categories.

related_formalizations:
  - id: "https://github.com/catskillsresearch/domain_theory"
    relationship: supersedes
    note: >-
      Same-author combined formalization that preceded this work
      (Apache-2.0). It was archived as the per-paper split progressed
      (scott1972 / scott1980 / scott1982 / scott_models), because each
      paper’s Lean outgrew one tree. This package plus vendor/ is the
      continuation, not a reimplementation by someone else. The archive
      is historical and is not vendored.

  - id: "https://github.com/catskillsresearch/scott1972/tree/36bf01f99f00fcb78b999052212372ba026521ba"
    relationship: other
    note: >-
      Same-author per-paper home for Scott 1972 continuous lattices,
      frozen at 36bf01f99f00fcb78b999052212372ba026521ba and copied
      into vendor/scott1972 for this Palomar snapshot. The remote
      remains the 1972 development; this tree is an in-tree convenience
